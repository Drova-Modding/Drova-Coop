# Builds and tests everything that can legally leave a machine with Drova installed.
#
# That is DrovaCoopMod.Protocol and its tests, and nothing else. The DrovaCoopMod melon references
# Il2Cppmscorlib, UnityEngine.CoreModule and Unity.InputSystem, which are generated from the game and
# cannot be published, so it is built by the pre-push hook on a developer machine instead.
#
# There is no separate check that the protocol assembly stays free of game references: adding one
# breaks this build, because the assemblies it would need are not here and never will be.
name: CI

on:
  push:
  pull_request:

jobs:
  protocol:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # There is no game here, so the one build input that is not source has to be fetched. It comes
      # from the API's own releases rather than from a copy kept beside this source: a checked-in
      # binary goes stale with nothing in any diff to say so, and this way the build states which
      # version it was checked against.
      #
      # Pinned rather than tracking the latest release, so a change published in the API repository
      # cannot alter what a commit here builds against without a commit here to match. Bump it when
      # the protocol assembly needs something newer - which is rare, since all it uses of the API are
      # the three networking interfaces.
      #
      # Since 0.6.0 the plain archive carries the networking interfaces and LiteNetLib.
      - name: Fetch the Drova Modding API
        env:
          API_RELEASE: release-0.6.0
        run: |
          curl --fail --location --silent --show-error \
            --output api.zip \
            "https://github.com/Drova-Modding/Drova-Modding-API/releases/download/$API_RELEASE/Modding_API.zip"

          # The whole archive, then one file out of it. The release is built on Windows and may store
          # backslashes as path separators, in which case unzip warns and exits non-zero while
          # extracting it perfectly well - and asking it for the single file by name does not work at
          # all, because patterns are matched against the stored name, backslashes and all. The copy
          # below is what fails the step if the archive ever stops carrying the assembly.
          unzip -q -o api.zip -d api || true

          mkdir -p .api
          cp api/Mods/Drova_Modding_API.dll .api/

      - name: Test
        run: dotnet test tests/DrovaCoopMod.Protocol.Tests --nologo
